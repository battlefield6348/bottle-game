<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b1f3b" />
    <title>Color Mart 倒水排序</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='20' y='6' width='24' height='52' rx='12' fill='%23ffffff' opacity='.3'/%3E%3Crect x='20' y='34' width='24' height='24' rx='12' fill='%23ff5fb1'/%3E%3Crect x='20' y='22' width='24' height='14' fill='%234cb8ff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="halloween-decor" aria-hidden="true">
      <svg width="0" height="0" class="defs">
        <symbol id="bat" viewBox="0 0 64 26">
          <path d="M0 6Q8-2 16 4Q20-4 26 2L29 0 30 4Q32 3 34 4L35 0 38 2Q44-4 48 4Q56-2 64 6Q56 6 52 12Q48 8 42 12Q38 8 34 14L32 18 30 14Q26 8 22 12Q16 8 12 12Q8 6 0 6Z" />
        </symbol>
        <symbol id="pumpkin" viewBox="0 0 100 90">
          <path d="M47 16C46 8 50 3 57 2l1 5c-4 1-5 4-4 10Z" fill="#4b6b2a" />
          <ellipse cx="30" cy="54" rx="26" ry="32" fill="#e3600d" />
          <ellipse cx="70" cy="54" rx="26" ry="32" fill="#e3600d" />
          <ellipse cx="50" cy="54" rx="24" ry="35" fill="#ff7f1e" />
          <g class="pumpkin-face" fill="#ffd84a">
            <path d="M28 46h12l-6-11Z" />
            <path d="M60 46h12l-6-11Z" />
            <path d="M46 56h8l-4-6Z" />
            <path d="M26 62l7 4 4-4 6 6 7-5 7 5 6-6 4 4 7-4Q50 90 26 62Z" />
          </g>
        </symbol>
      </svg>
      <div class="stars"></div>
      <div class="moon"></div>
      <svg class="bat bat-1"><use href="#bat" /></svg>
      <svg class="bat bat-2"><use href="#bat" /></svg>
      <svg class="bat bat-3"><use href="#bat" /></svg>
      <div class="spider">
        <svg viewBox="0 0 40 36">
          <g stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round">
            <path d="M14 14 6 8 2 14M14 18 4 18 1 24M15 21 7 27 5 34M26 14l8-6 4 6M26 18h10l3 6M25 21l8 6 2 7" />
          </g>
          <ellipse cx="20" cy="18" rx="8" ry="9" fill="currentColor" />
          <circle cx="17" cy="15" r="1.6" fill="#ff5a3c" />
          <circle cx="23" cy="15" r="1.6" fill="#ff5a3c" />
        </svg>
      </div>
      <svg class="graveyard" viewBox="0 0 1200 140" preserveAspectRatio="none">
        <path d="M0 140V92Q150 58 320 84T640 78T960 70T1200 86V140Z" fill="#120c22" />
        <path d="M0 140V112Q200 92 420 110T820 104T1200 108V140Z" fill="#0a0716" />
      </svg>
      <svg class="pumpkin pumpkin-left"><use href="#pumpkin" /></svg>
      <svg class="pumpkin pumpkin-right"><use href="#pumpkin" /></svg>
    </div>

    <canvas id="board" aria-label="遊戲盤面"></canvas>

    <header class="hud">
      <div class="hud-title">
        <span class="level" id="level-label">第 1 關</span>
        <span class="chips" id="mechanic-chips"></span>
      </div>
      <div class="hud-actions">
        <button class="icon-button" id="home-button" aria-label="回到首頁" title="回到首頁">
          <svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7M6 9.5V20h4.5v-5h3v5H18V9.5" /></svg>
        </button>
        <button class="icon-button" id="restart-button" aria-label="重玩本關" title="重玩本關">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4.5h4.5" /></svg>
        </button>
        <button class="icon-button" id="undo-button" aria-label="復原一步" title="復原一步 (Ctrl+Z)">
          <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h11a5 5 0 0 1 0 10h-4" /></svg>
        </button>
        <button class="icon-button" id="hint-button" aria-label="提示" title="提示">
          <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3Z" /></svg>
        </button>
        <button class="icon-button" id="solve-button" aria-label="一鍵通關" title="一鍵通關（自動展示完整步驟）">
          <svg viewBox="0 0 24 24"><path d="M4 5v14l8-7ZM12 5v14l8-7Z" /></svg>
        </button>
      </div>
    </header>

    <aside class="autoplay" id="autoplay" hidden>
      <div class="autoplay-bar">
        <button class="autoplay-summary" id="autoplay-toggle" aria-expanded="true" aria-controls="steps-list">
          <span class="autoplay-count" id="autoplay-count"></span>
          <span class="autoplay-current" id="autoplay-current"></span>
        </button>
        <button class="icon-button" id="autoplay-pause" aria-label="暫停" title="暫停">
          <svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" /></svg>
        </button>
        <button class="icon-button" id="autoplay-stop" aria-label="停止自動通關" title="停止自動通關">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <ol class="steps" id="steps-list"></ol>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="overlay" id="loading" hidden>
      <div class="spinner"></div>
    </div>

    <div class="overlay" id="mechanic-dialog" hidden>
      <div class="card">
        <p class="eyebrow">新機制</p>
        <h2 id="mechanic-title"></h2>
        <p id="mechanic-text"></p>
        <button class="primary" id="mechanic-ok">知道了</button>
      </div>
    </div>

    <div class="overlay" id="win-dialog" hidden>
      <div class="card">
        <p class="eyebrow">太棒了</p>
        <h2 id="win-title">過關！</h2>
        <p id="win-text"></p>
        <button class="primary" id="next-button">下一關</button>
      </div>
    </div>

    <div class="overlay home" id="home">
      <div class="card home-card">
        <p class="eyebrow">Color Mart</p>
        <h1 class="home-title">倒水排序</h1>
        <p class="home-progress" id="home-progress"></p>
        <button class="primary home-continue" id="home-continue"></button>

        <form class="home-form" id="home-form" novalidate>
          <p class="home-section">自訂關卡</p>
          <label class="field">
            <span>Seed（相同 seed 的玩家會玩到相同的關卡）</span>
            <span class="field-row">
              <input id="seed-input" type="number" inputmode="numeric" min="0" max="4294967295" step="1" required />
              <button type="button" class="icon-button" id="seed-random" aria-label="隨機 seed" title="隨機 seed">
                <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" /><path d="M9 9h.01M15 15h.01M15 9h.01M9 15h.01M12 12h.01" /></svg>
              </button>
            </span>
          </label>
          <label class="field">
            <span>關卡</span>
            <input id="level-input" type="number" inputmode="numeric" min="1" step="1" required />
          </label>
          <p class="field-error" id="home-error" role="alert"></p>
          <button type="submit" class="secondary home-go">前往這一關</button>
        </form>
      </div>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
